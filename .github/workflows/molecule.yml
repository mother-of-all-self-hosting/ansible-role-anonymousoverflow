---
name: molecule

on: [push, pull_request]  # yamllint disable-line rule:truthy

jobs:
  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        distro:
          - ubuntu2604
          - debian13
        scenario:
          - default
          - default-selfbuild
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: anonymousoverflow

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: anonymousoverflow/.python-version
          cache: pip
          cache-dependency-path: anonymousoverflow/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: anonymousoverflow
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('anonymousoverflow/molecule/default/requirements.yml') }}

      - name: Run Molecule
        working-directory: anonymousoverflow
        run: molecule test --scenario-name ${{ matrix.scenario }}
