---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: anonymousoverflow-${MOLECULE_DISTRO:-ubuntu2604}-default-selfbuild
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        anonymousoverflow_debug_service_enabled: false

        # The container and network names the role derives from its identifier,
        # and the path it installs into. Role defaults are not in scope in every
        # play, so they are spelled out.
        anonymousoverflow_molecule_container: anonymousoverflow
        anonymousoverflow_molecule_container_network: anonymousoverflow
        anonymousoverflow_molecule_base_path: /anonymousoverflow

        anonymousoverflow_molecule_host_port: 8080

        # The theme the role is made to configure. Anything but `auto`, which is
        # what AnonymousOverflow renders when nothing sets THEME. This scenario
        # is about where the image came from rather than about configuration
        # reach, which the `default` scenario covers thoroughly, but a
        # self-built image that ignores its env file would still be a broken
        # install.
        anonymousoverflow_molecule_theme: dark

        # Variables for AnonymousOverflow
        anonymousoverflow_uid: 1000
        anonymousoverflow_gid: 1000
        anonymousoverflow_scheme: http
        anonymousoverflow_hostname: anonymousoverflow.molecule.example.com
        anonymousoverflow_container_labels_traefik_enabled: false
        anonymousoverflow_container_http_host_bind_port: 127.0.0.1:8080
        anonymousoverflow_environment_variable_jwt_signing_secret: molecule-jwt-signing-secret-0123456789

        anonymousoverflow_environment_variables_additional_variables: |
          THEME={{ anonymousoverflow_molecule_theme }}
          DISABLE_RATELIMIT=true

        # What this scenario is for: build the image from AnonymousOverflow's
        # own Dockerfile instead of pulling it.
        anonymousoverflow_container_image_self_build: true
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
